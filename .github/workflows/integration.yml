name: WordPress integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "wp-definitivo/**"
      - "tests/e2e/**"
      - ".wp-env.json"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run wp-env:start
      - run: npx wp-env run cli wp theme activate wp-definitivo
      - run: npx wp-env run cli wp plugin activate theme-check woocommerce elementor
      - run: npx wp-env run cli wp theme-check run wp-definitivo
      - run: npm run test:e2e
      - if: always()
        run: npm run wp-env:stop
